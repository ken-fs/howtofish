<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="How to Fish guide">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1e1d"/>
      <stop offset="1" stop-color="#05100f"/>
    </linearGradient>
    <linearGradient id="fish" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5affd6"/>
      <stop offset="1" stop-color="#22c9a3"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="30%" r="55%">
      <stop offset="0" stop-color="#43ffcf" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#43ffcf" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- sonar ping arcs, top-right corner -->
  <g fill="none" stroke="#43ffcf" stroke-linecap="round" opacity="0.28">
    <path d="M1000 70 a150 150 0 0 1 150 150" stroke-width="10"/>
    <path d="M1000 130 a90 90 0 0 1 90 90" stroke-width="10"/>
  </g>

  <!-- fish motif, bottom-right corner (clear of the title) -->
  <g fill="url(#fish)" opacity="0.95" transform="translate(980 452) scale(0.8)">
    <path d="M150 256 C170 200 226 176 282 176 C352 176 406 216 420 256 C406 296 352 336 282 336 C226 336 170 312 150 256 Z" transform="translate(-150 -256)"/>
    <path d="M156 256 L78 208 L104 256 L78 304 Z" transform="translate(-150 -256)"/>
    <circle cx="210" cy="-18" r="16" fill="#05100f"/>
    <circle cx="216" cy="-24" r="5" fill="#eaf6f2"/>
  </g>

  <!-- text block, left -->
  <text x="80" y="150" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" letter-spacing="4" fill="#43ffcf">STEAM GAME GUIDE</text>
  <text x="76" y="285" font-family="Helvetica, Arial, sans-serif" font-size="116" font-weight="bold" fill="#ff8b3d">HOW TO FISH</text>
  <text x="80" y="375" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="bold" fill="#eaf6f2">Fish list · All 28 achievements · Co-op</text>
  <text x="80" y="565" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#7d9c95">howtofishthegame.com</text>
</svg>
